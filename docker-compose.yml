services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: paper
      TWS_ACCEPT_INCOMING: accept
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-trader}
    ports:
      # gnzsnz maps paper API to 4004 inside the published port mapping convention
      - "4004:4004"
      - "5900:5900"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Reload so volume-mounted src/ changes apply without a manual recreate.
    command: ["uvicorn", "trader.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trader:trader@postgres:5432/trader
      DATABASE_URL_SYNC: postgresql://trader:trader@postgres:5432/trader
      IBKR_HOST: ${IBKR_HOST:-ib-gateway}
      IBKR_PORT: ${IBKR_PORT:-4004}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ib-gateway:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./config:/app/config

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      OPERATOR_USER: ${OPERATOR_USER:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-change_me}
    depends_on:
      - api
      - web

volumes:
  pgdata:
